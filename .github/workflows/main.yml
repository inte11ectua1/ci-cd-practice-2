name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check calculator
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile calculator.py

      - name: Run calculator
        run: python -c "import calculator; print(calculator.add(2, 3))"
      - name: Run unit tests
        run: python -m unittest discover -v
